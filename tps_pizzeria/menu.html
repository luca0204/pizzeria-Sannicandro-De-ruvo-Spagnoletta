<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pizzeria </title>

    <style>                       
        body {
            font-family: Georgia, serif;
            background-color: #f8f0df;
            color: #3b2416;
            margin: 0;
            padding: 20px;
        }

        .menu { /*.menu è una classe css, il punto indica che sto selezionando tutti gli elementi che hanno class=menu */
            max-width: 750px; /*imposta una larghezza massima di 750 pixel. Il riquadro non diventa più largo di così, anche se lo schermo è grande. */
            margin: auto; /*distribuisce automaticamente lo spazio esterno disponibile, centrando orizzontalmente il riquadro quando possibile. */
            background: #fffaf0;/*imposta lo sfondo del menu con un colore bianco crema. */
            padding: 35px;/* crea 35 pixel di spazio interno tra il contenuto e i bordi.*/
            border: 4px double #a52a2a;/*crea un bordo spesso 4 pixel, doppio, di colore rosso scuro. */
            border-radius: 12px;/*arrotonda gli angoli del riquadro di 12 pixel. */
        }

        header {
            text-align: center;/*centra il testo orizzontalmente. */
            border-bottom: 2px solid #a52a2a;/*crea una linea inferiore rossa scura, spessa 2 pixel e continua. */
            padding-bottom: 20px;/* aggiunge 20 pixel di spazio sotto il contenuto dell'intestazione, prima del bordo.*/
        }

       .categorie {
            display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;


       }

        footer {
            text-align: center;
            margin-top: 35px;
            border-top: 2px solid #a52a2a;
            padding-top: 20px;
        }
    </style>           
</head>

<body>

    <div class="menu">

    <header>
        <h1>SanderSpà Pizza</h1>
        <p>La vera pizza italiana</p>
        <p>Menu - Pizzeria & Ristorante</p>
    </header>

   <div class="categorie">

    <a href="pizze.html" class="pulsante">
        <button type="button">Pizze</button>
    </a>

    <a href="dolci.html" class="pulsante">
        <button type="button">Dolci</button>
    </a>

    <a href="bevande.html" class="pulsante">
        <button type="button">Bevande</button>
    </a>

</div>

    
    <footer>
        <h3>Grazie per averci scelto!</h3>
        <p>Via Roma, 10 - Molfetta</p>
        <p>Tel. 333 1234567</p>
        <p>Contattaci</p>
    </footer>

    <!-- Pulsante per aprire la pagina delle prenotazioni -->
    <div style="text-align: center; margin-top: 25px;">
        <a href="prenotazione.html" class="pulsante">
            <button type="Prenota">Prenota</button>
        </a>
    </div>

</div>

</body>
</html>
